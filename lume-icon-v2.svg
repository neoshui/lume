  <circle cx="113" cy="112" r="29" fill="#eaf3ff" stroke="#ffffff" stroke-width="4"/>
  <line x1="145" y1="145" x2="177" y2="177" stroke="#55759e" stroke-width="17" stroke-linecap="round"/>
  <line x1="145" y1="145" x2="174" y2="174" stroke="#83a5cb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="99" cy="96" r="8" fill="#ffffff" opacity=".78"/>
